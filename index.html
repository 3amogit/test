<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>True or False</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #0071e3;
    --true: #34c759;
    --false: #ff3b30;
    --border: #e5e5ea;
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #98989d;
      --accent: #0a84ff;
      --true: #30d158;
      --false: #ff453a;
      --border: #38383a;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
  }
  .progress {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0;
    transition: width 0.3s ease;
  }
  .question {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: -0.01em;
    margin-bottom: 24px;
    min-height: 58px;
  }
  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  button {
    font: inherit;
    font-size: 17px;
    font-weight: 600;
    padding: 16px;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: transform 0.1s ease, background 0.2s ease, border-color 0.2s ease;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { cursor: default; }
  button.correct { background: var(--true); border-color: var(--true); color: #fff; }
  button.wrong { background: var(--false); border-color: var(--false); color: #fff; }
  button.dim { opacity: 0.4; }
  .feedback {
    margin-top: 20px;
    padding: 14px 16px;
    border-radius: 12px;
    background: var(--bg);
    font-size: 15px;
    line-height: 1.45;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .next {
    width: 100%;
    margin-top: 16px;
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    display: none;
  }
  .next.show { display: block; }
  .result { text-align: center; }
  .result .score {
    font-size: 56px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 8px 0 4px;
  }
  .result p { color: var(--muted); margin-bottom: 24px; }
</style>
</head>
<body>
<main class="card" id="app" aria-live="polite"></main>

<script>
  // ✏️ EDIT YOUR QUESTIONS HERE
  // answer: true or false · explain: shown after they answer
  const questions = [
    {
      q: "A color can look different depending on the colors around it.",
      answer: true,
      explain: "This is color relativity — the core idea of Josef Albers's Interaction of Color."
    },
    {
      q: "Making text bigger is the only way to create visual hierarchy.",
      answer: false,
      explain: "Weight, color, contrast, spacing and position all create hierarchy — size is just one tool."
    },
    {
      q: "Consistent spacing makes a screen feel more polished.",
      answer: true,
      explain: "A spacing scale (like 4, 8, 16, 24, 32) creates rhythm and makes layouts feel intentional."
    },
    {
      q: "A strong brand should change its colors often to stay fresh.",
      answer: false,
      explain: "Distinctive brand assets work through consistency — people recognize what they see repeatedly."
    }
  ];

  const app = document.getElementById("app");
  let index = 0;
  let score = 0;

  function renderQuestion() {
    const item = questions[index];
    const pct = (index / questions.length) * 100;
    app.innerHTML = `
      <div class="progress">
        <span>Question ${index + 1} of ${questions.length}</span>
        <span>Score: ${score}</span>
      </div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      <p class="question">${item.q}</p>
      <div class="buttons">
        <button data-value="true">True</button>
        <button data-value="false">False</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <button class="next" id="next">${index === questions.length - 1 ? "See results" : "Next"}</button>
    `;
    app.querySelectorAll("[data-value]").forEach(btn =>
      btn.addEventListener("click", () => choose(btn, btn.dataset.value === "true"))
    );
    document.getElementById("next").addEventListener("click", () => {
      index++;
      index < questions.length ? renderQuestion() : renderResult();
    });
  }

  function choose(btn, value) {
    const item = questions[index];
    const isRight = value === item.answer;
    if (isRight) score++;

    app.querySelectorAll("[data-value]").forEach(b => {
      b.disabled = true;
      const bValue = b.dataset.value === "true";
      if (bValue === item.answer) b.classList.add("correct");
      else if (b === btn) b.classList.add("wrong");
      else b.classList.add("dim");
    });

    const fb = document.getElementById("feedback");
    fb.innerHTML = `<strong>${isRight ? "✓ Correct" : "✗ Not quite"}</strong>${item.explain}`;
    fb.classList.add("show");
    document.getElementById("next").classList.add("show");
  }

  function renderResult() {
    app.innerHTML = `
      <div class="bar"><div class="bar-fill" style="width:100%"></div></div>
      <div class="result">
        <div class="progress" style="justify-content:center">Your score</div>
        <div class="score">${score}/${questions.length}</div>
        <p>${score === questions.length ? "Perfect! 🎉" : "Nice work — try again to get them all."}</p>
        <button class="next show" id="restart">Try again</button>
      </div>
    `;
    document.getElementById("restart").addEventListener("click", () => {
      index = 0; score = 0; renderQuestion();
    });
  }

  renderQuestion();
</script>
</body>
</html>
