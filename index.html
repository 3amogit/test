<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Basics</title>
<!-- Embed tags: tell Circle (Iframely) this page can be shown as an embedded player -->
<meta property="og:title" content="Design Basics">
<meta property="og:description" content="Shapes, color and a simple chart.">
<meta property="og:url" content="https://3amogit.github.io/test/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="player">
<meta name="twitter:title" content="Design Basics">
<meta name="twitter:player" content="https://3amogit.github.io/test/">
<meta name="twitter:player:width" content="480">
<meta name="twitter:player:height" content="900">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    padding: 16px;
  }
  main { max-width: 480px; margin: 0 auto; display: grid; gap: 16px; }
  .card { background: #fff; border-radius: 18px; padding: 20px; }
  h1 { font-size: 26px; letter-spacing: -0.02em; }
  h2 { font-size: 17px; margin-bottom: 14px; }
  p { color: #6e6e73; font-size: 15px; line-height: 1.45; margin-top: 6px; }
  svg { width: 100%; height: auto; display: block; }
  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .swatch { aspect-ratio: 1; border-radius: 12px; }
  .label { font-size: 11px; color: #6e6e73; text-align: center; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Design Basics</h1>
    <p>Shapes, color and hierarchy at a glance.</p>
  </div>

  <div class="card">
    <h2>Shapes</h2>
    <svg viewBox="0 0 440 220" role="img" aria-label="Colored shapes">
      <circle cx="90" cy="110" r="70" fill="#0071e3"/>
      <rect x="180" y="45" width="130" height="130" rx="18" fill="#ff9f0a"/>
      <polygon points="350,175 395,45 440,175" fill="#34c759"/>
      <circle cx="150" cy="40" r="22" fill="#ff375f"/>
      <rect x="290" y="150" width="40" height="40" rx="10" fill="#bf5af2" transform="rotate(15 310 170)"/>
    </svg>
  </div>

  <div class="card">
    <h2>Palette</h2>
    <div class="swatches">
      <div><div class="swatch" style="background:#0071e3"></div><div class="label">Blue</div></div>
      <div><div class="swatch" style="background:#34c759"></div><div class="label">Green</div></div>
      <div><div class="swatch" style="background:#ff9f0a"></div><div class="label">Orange</div></div>
      <div><div class="swatch" style="background:#ff375f"></div><div class="label">Pink</div></div>
      <div><div class="swatch" style="background:#bf5af2"></div><div class="label">Purple</div></div>
    </div>
  </div>

  <div class="card">
    <h2>What creates hierarchy</h2>
    <svg viewBox="0 0 440 200" role="img" aria-label="Bar chart: size 90, weight 75, color 60, spacing 45">
      <g font-family="-apple-system, sans-serif" font-size="13" fill="#6e6e73">
        <text x="0" y="28">Size</text>
        <text x="0" y="76">Weight</text>
        <text x="0" y="124">Color</text>
        <text x="0" y="172">Spacing</text>
      </g>
      <rect x="80" y="12" width="324" height="24" rx="6" fill="#0071e3"/>
      <rect x="80" y="60" width="270" height="24" rx="6" fill="#0071e3" opacity="0.8"/>
      <rect x="80" y="108" width="216" height="24" rx="6" fill="#0071e3" opacity="0.6"/>
      <rect x="80" y="156" width="162" height="24" rx="6" fill="#0071e3" opacity="0.4"/>
    </svg>
    <p>Illustrative example, not real data.</p>
  </div>
</main>
</body>
</html>
